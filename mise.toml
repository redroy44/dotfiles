"pipx:httpie" = "latest"
"pipx:awsume" = "latest"
"pipx:aws-sso-util" = "latest"

# infra / cloud (tenv dropped — mise does per-project terraform versions itself)
terraform = "latest"
terraform-ls = "latest"
tflint = "latest"
kubectl = "latest"
helm = "latest"
k9s = "latest"
vault = "latest"
awscli = "latest"
gcloud = "latest"
heroku = "latest"
docker-compose = "latest"
lazydocker = "latest"
act = "latest"

# cli utils
bat = "latest"
