# Global mise config — symlink to ~/.config/mise/config.toml (see README)
#   ln -sf ~/repos/dotfiles/mise.toml ~/.config/mise/config.toml

# sources are absolute: relative paths resolve against the config file's
# directory, which is ~/.config/mise when loaded via the global symlink
[dotfiles]
"~/.config/mise/config.toml" = "~/repos/dotfiles/mise.toml"
"~/.zshenv" = "~/repos/dotfiles/dotfiles/zshenv"
"~/.zshrc" = "~/repos/dotfiles/dotfiles/zshrc"
"~/.config/git/config" = "~/repos/dotfiles/dotfiles/gitconfig"
"~/.config/git/ignore" = "~/repos/dotfiles/dotfiles/gitignore"
"~/.config/kitty/kitty.conf" = "~/repos/dotfiles/dotfiles/kitty.conf"
"~/.config/kitty/kitty-theme.conf" = "~/repos/dotfiles/dotfiles/kitty-theme.conf"
"~/.config/starship.toml" = "~/repos/dotfiles/dotfiles/starship.toml"
"~/.config/tmux/tmux.conf" = "~/repos/dotfiles/dotfiles/tmux.conf"

# oh-my-zsh + plugins, declaratively cloned (replaces nix-store omz)
[bootstrap.repos."~/.oh-my-zsh"]
url = "https://github.com/ohmyzsh/ohmyzsh.git"

[bootstrap.repos."~/.oh-my-zsh/custom/plugins/zsh-autosuggestions"]
url = "https://github.com/zsh-users/zsh-autosuggestions.git"

[bootstrap.repos."~/.oh-my-zsh/custom/plugins/zsh-syntax-highlighting"]
url = "https://github.com/zsh-users/zsh-syntax-highlighting.git"

[settings]
lockfile = true

[tools]
# languages / runtimes (pins match previous nix versions)
java = "temurin-21"
python = "3.14"
node = "24"
bun = "latest"
rust = "stable"
uv = "latest"

# scala
sbt = "latest"
scala = "latest"
scalafmt = "latest"
scala-cli = "latest"
coursier = "latest"

# python tooling
poetry = "latest"
"pipx:httpie" = "latest"
"pipx:awsume" = "latest"
"pipx:aws-sso-util" = "latest"

# infra / cloud (tenv dropped — mise does per-project terraform versions itself)
terraform = "latest"
terraform-ls = "latest"
tflint = "latest"
kubectl = "latest"
helm = "latest"
k9s = "latest"
vault = "latest"
awscli = "latest"
gcloud = "latest"
heroku = "latest"
docker-compose = "latest"
lazydocker = "latest"
act = "latest"

# cli utils
bat = "latest"
bottom = "latest"
delta = "latest"
difftastic = "latest"
direnv = "latest"
fd = "latest"
fzf = "latest"
gdu = "latest"
gh = "latest"
jq = "latest"
just = "latest"
lazygit = "latest"
lsd = "latest"
neovim = "latest"
pre-commit = "latest"
ripgrep = "latest"
starship = "latest"
atuin = "latest"
tmux = "latest"
yazi = "latest"
yq = "latest"

# misc dev tools (were pkgsUnstable in nix)
opencode = "latest"
worktrunk = "latest"
herdr = "latest"
rtk = "latest"

# not in registry — installed via mise's brew backend, no Homebrew needed
[bootstrap.packages]
"brew:autojump" = "latest"
"brew:gnupg" = "latest"
"brew:graphviz" = "latest"
"brew:htop" = "latest"
"brew:kcat" = "latest"
"brew:fastfetch" = "latest"  # neofetch is archived & gone from brew; fastfetch is the successor
"brew:the_silver_searcher" = "latest"
"brew:tree" = "latest"
"brew:wget" = "latest"
"brew:docker" = "latest"
